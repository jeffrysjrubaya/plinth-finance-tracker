<div class="table-container mat-elevation-z0">
  <table mat-table [dataSource]="dataSource" class="accord-table">

    <ng-container matColumnDef="partner">
      <th mat-header-cell *matHeaderCellDef> Member </th>
      <td mat-cell *matCellDef="let element">
        <div class="partner-cell">
          <img [src]="element.avatar" class="avatar-sq" [matTooltip]="element.partnerName">
          <mat-icon class="sub-icon">{{ element.categoryIcon }}</mat-icon>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let element">
        <div class="details-cell">
          <span class="main-text">{{ element.description }}</span>
          <span class="sub-text">{{ element.date | date:'mediumDate' }} • {{ element.category }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef> Amount </th>
      <td mat-cell *matCellDef="let element" [class.negative]="element.amount < 0">
        <span class="amount-text">{{ element.amount | currency }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <span class="status-badge" [ngClass]="element.status.toLowerCase()">
          {{ element.status }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button [matMenuTriggerFor]="actionMenu">
          <mat-icon>more_horiz</mat-icon>
        </button>
      </td>
    </ng-container>

    <mat-menu #actionMenu="matMenu" xPosition="before" class="accord-action-menu">
    <button mat-menu-item>
        <mat-icon color="warn">flag</mat-icon>
        <span>Flag for Partner</span>
    </button>
    <button mat-menu-item>
        <mat-icon>edit</mat-icon>
        <span>Edit Transaction</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item>
        <mat-icon>receipt_long</mat-icon>
        <span>View Receipt</span>
    </button>
    </mat-menu>



    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="clickable-row"></tr>
  </table>
</div>
