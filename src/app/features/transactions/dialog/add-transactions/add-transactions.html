<h2 mat-dialog-title>Add New Transaction</h2>

<mat-dialog-content>
  <form [formGroup]="transactionForm" class="transaction-form">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" placeholder="e.g., Whole Foods Market">
      <mat-icon matSuffix>edit</mat-icon>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Amount</mat-label>
        <span matPrefix>₱&nbsp;</span>
        <input matInput type="number" formControlName="amount" placeholder="0.00">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Transaction Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Account</mat-label>
        <mat-select formControlName="accountId">
          <mat-option *ngFor="let acc of accounts()" [value]="acc.accountId">
            {{ acc.accountName }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option value="Expense">Expense</mat-option>
          <mat-option value="Income">Income</mat-option>
          <mat-option value="Transfer">Transfer</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>CANCEL</button>
  <button mat-raised-button color="primary" 
          [mat-dialog-close]="transactionForm.value" 
          [disabled]="transactionForm.invalid">
    SAVE TRANSACTION
  </button>
</mat-dialog-actions>
