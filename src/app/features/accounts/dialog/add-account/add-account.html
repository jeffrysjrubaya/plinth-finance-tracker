<h2 mat-dialog-title>Add New Account</h2>

<mat-dialog-content>
  <form [formGroup]="accountForm" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Account Name</mat-label>
      <input matInput formControlName="accountName" placeholder="e.g. Savings">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Account Type</mat-label>
      <mat-select formControlName="accountCategoryId">
        @for (item of accountcategory; track $index) {
            <mat-option [value]="item.accountCategoryId">{{ item.accountCategoryName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Initial Balance</mat-label>
      <span matPrefix>$&nbsp;</span>
      <input matInput type="number" formControlName="amount">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">CANCEL</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="accountForm.invalid">
    {{data.action}}
  </button>
</mat-dialog-actions>
