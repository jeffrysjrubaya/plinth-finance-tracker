<div class="login-container">
    <mat-card class="login-card">
    <mat-card-header>
        <mat-card-title>Welcome Back</mat-card-title>
        <mat-card-subtitle>Please login to your account</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" placeholder="pat@example.com" />
            <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')"
            >Email is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" />
            <button mat-icon-button matSuffix (click)="hide = !hide" type="button">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="forgot-password-container">
            <a (click)="openForgotPassword()" class="forgot-link">Forgot password?</a>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-flat-button
          color="primary"
          class="full-width"
          type="submit"
          [disabled]="!loginForm.valid"
        >
          LOGIN
        </button>
      </mat-card-actions>
    </form>

    <div class="register-link-container">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register" class="register-link">Register here</a>
    </div>
  </mat-card>
</div>
