<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
      <mat-card-subtitle>Join us to get started</mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" placeholder="John Doe" />
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="registerForm.get('email')?.invalid">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Min. 8 characters</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirm Password</mat-label>
            <input
            matInput
            [type]="hideConfirmPassword ? 'password' : 'text'"
            formControlName="confirmPassword"
          />
          <button
            mat-icon-button
            matSuffix
            (click)="hideConfirmPassword = !hideConfirmPassword"
            type="button"
          >
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="registerForm.hasError('passwordMismatch')">
            Passwords do not match
          </mat-error>
        </mat-form-field>

        <div class="terms-section">
          <input type="checkbox" formControlName="acceptTerms" id="acceptTerms" />
          <label for="acceptTerms">I agree to the Terms and Privacy Policy</label>
          <!-- <mat-checkbox formControlName="acceptTerms" color="primary">
            
          </mat-checkbox> -->
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-flat-button
          color="primary"
          class="full-width"
          type="submit"
          [disabled]="!registerForm.valid"
        >
          SIGN UP
        </button>
      </mat-card-actions>
    </form>

    <div class="footer-link">Already have an account? <a href="/auth/login">Login</a></div>
  </mat-card>
</div>
